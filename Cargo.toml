[package]
name = "scan-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared Rust implementation for the scan R and Python packages"

[dependencies]
rand = "0.9"
rand_xoshiro = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
